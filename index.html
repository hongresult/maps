<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JADWAL RESULT ALL PASARAN</title>
<!-- Google Fonts for Vintage / Parchment Aesthetics -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=IM+Fell+English:ital@0;1&family=MedievalSharp&family=Playfair+Display:ital,wght@0,600;0,800;1,400&family=Roboto+Mono:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>

<style>
/* ==========================================================================
    VINTAGE DESIGN TOKENS & COLOR PALETTES
    ========================================================================== */
:root {
    --bg-base: #f4e8c1;
    --paper-bg: rgba(245, 230, 195, 0.95);
    --paper-border: #8c6d3f;
    --paper-shadow: rgba(60, 35, 10, 0.4);
    --text-primary: #2b1b0e;
    --text-secondary: #5c3e1e;
    --accent-gold: #c59b27;
    --accent-wax: #8b1e1e;
    --accent-cyan-ink: #1b5e5c;
    --card-bg: rgba(238, 218, 177, 0.85);
    --card-border: #a88448;
}

[data-theme="dark-parchment"] {
    --bg-base: #1c140d;
    --paper-bg: rgba(35, 25, 17, 0.95);
    --paper-border: #7a5c37;
    --paper-shadow: rgba(0, 0, 0, 0.8);
    --text-primary: #ecdcb9;
    --text-secondary: #c2a678;
    --accent-gold: #d4af37;
    --accent-wax: #b33939;
    --accent-cyan-ink: #489a94;
    --card-bg: rgba(45, 33, 22, 0.9);
    --card-border: #634827;
}

[data-theme="pirate-map"] {
    --bg-base: #d2b48c;
    --paper-bg: rgba(205, 170, 125, 0.95);
    --paper-border: #6e4722;
    --paper-shadow: rgba(45, 25, 5, 0.5);
    --text-primary: #1f1206;
    --text-secondary: #4a2e11;
    --accent-gold: #b8860b;
    --accent-wax: #990000;
    --accent-cyan-ink: #206060;
    --card-bg: rgba(195, 158, 112, 0.88);
    --card-border: #8b5a2b;
}

[data-theme="wax-scroll"] {
    --bg-base: #e6ccb2;
    --paper-bg: rgba(230, 204, 178, 0.95);
    --paper-border: #7f5539;
    --paper-shadow: rgba(70, 40, 20, 0.45);
    --text-primary: #3c0919;
    --text-secondary: #6b2d42;
    --accent-gold: #b07d4b;
    --accent-wax: #6b0504;
    --accent-cyan-ink: #005f73;
    --card-bg: rgba(221, 184, 146, 0.88);
    --card-border: #9c6644;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'IM Fell English', serif;
    background-color: var(--bg-base);
    color: var(--text-primary);
    min-height: 100vh;
    padding: 20px;
    position: relative;
    overflow-x: hidden;
    transition: background-color 0.5s ease, color 0.5s ease;
}

/* Background Canvas Overlay */
#vintageCanvas {
    position: fixed;
    inset: 0;
    z-index: -10;
    pointer-events: none;
}

/* Aged Vignette Overlay */
body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at center, transparent 35%, rgba(40, 20, 5, 0.4) 85%, rgba(15, 5, 0, 0.75) 100%);
    z-index: -5;
    pointer-events: none;
}

.parchment-container {
    max-width: 1100px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
}

/* STICKY TOP GROUP */
.sticky-top-group {
    position: sticky;
    top: 0;
    z-index: 1000;
    background-color: var(--bg-base);
    padding-top: 10px;
    padding-bottom: 10px;
    transition: background-color 0.5s ease;
}

/* HEADER SECTION */
.header-box {
    background: var(--paper-bg);
    border: 3px double var(--paper-border);
    border-radius: 12px;
    padding: 20px 20px;
    box-shadow: 0 10px 30px var(--paper-shadow), inset 0 0 40px rgba(110, 70, 20, 0.2);
    backdrop-filter: blur(6px);
    text-align: center;
    position: relative;
    overflow: hidden;
    margin-bottom: 16px;
}

.header-box::before, .header-box::after {
    content: '❦';
    position: absolute;
    font-size: 28px;
    color: var(--paper-border);
    opacity: 0.7;
}
.header-box::before { top: 8px; left: 16px; }
.header-box::after { top: 8px; right: 16px; }

.header-title {
    font-family: 'Cinzel', serif;
    font-size: clamp(22px, 4vw, 34px);
    font-weight: 900;
    letter-spacing: 2px;
    color: var(--text-primary);
    text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.4), -1px -1px 2px rgba(0, 0, 0, 0.2);
    text-transform: uppercase;
}

.header-subtitle {
    font-family: 'Playfair Display', serif;
    font-size: clamp(13px, 1.8vw, 16px);
    font-weight: 600;
    color: var(--accent-wax);
    letter-spacing: 1px;
    margin-top: 4px;
    font-style: italic;
}

.header-date {
    font-family: 'MedievalSharp', cursive;
    font-size: clamp(16px, 2.5vw, 22px);
    margin-top: 8px;
    color: var(--text-secondary);
}

.live-clock {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: clamp(24px, 4.5vw, 38px);
    margin-top: 8px;
    color: var(--accent-wax);
    text-shadow: 0 0 12px rgba(139, 30, 30, 0.3);
    letter-spacing: 3px;
}

/* THEME SWITCHER BAR */
.theme-panel {
    background: var(--paper-bg);
    border: 2px solid var(--paper-border);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 12px;
    box-shadow: 0 6px 16px var(--paper-shadow);
}

.theme-btn {
    font-family: 'Cinzel', serif;
    font-size: 13px;
    font-weight: 700;
    padding: 8px 14px;
    border-radius: 6px;
    border: 1px solid var(--paper-border);
    background: rgba(0, 0, 0, 0.05);
    color: var(--text-primary);
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
}

.theme-btn:hover {
    background: var(--accent-gold);
    color: #1a0f05;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
}

.theme-btn.active {
    background: var(--accent-wax);
    color: #fff8eb;
    border-color: var(--accent-wax);
    box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.4);
}

/* SEARCH & CONTROLS */
.controls-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    background: var(--paper-bg);
    border: 2px solid var(--paper-border);
    border-radius: 10px;
    padding: 10px 14px;
    box-shadow: 0 6px 16px var(--paper-shadow);
    margin-bottom: 16px;
}

.search-container {
    flex: 1;
    min-width: 260px;
    position: relative;
}

.search-input {
    width: 100%;
    padding: 10px 20px 10px 44px;
    font-family: 'IM Fell English', serif;
    font-size: 18px;
    color: var(--text-primary);
    background: var(--card-bg);
    border: 2px solid var(--paper-border);
    border-radius: 8px;
    box-shadow: inset 0 2px 6px var(--paper-shadow);
    outline: none;
    transition: all 0.3s ease;
}

.search-input:focus {
    border-color: var(--accent-wax);
    box-shadow: inset 0 2px 6px var(--paper-shadow), 0 0 10px rgba(139, 30, 30, 0.3);
}

.search-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 20px;
    color: var(--text-secondary);
    pointer-events: none;
}

.add-btn {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: 15px;
    padding: 0 22px;
    background: var(--accent-wax);
    color: #fff8eb;
    border: 2px solid var(--paper-border);
    border-radius: 8px;
    cursor: pointer;
    box-shadow: 0 4px 10px var(--paper-shadow);
    transition: all 0.25s ease;
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
}

.add-btn:hover {
    background: #a32222;
    transform: translateY(-2px);
    box-shadow: 0 6px 14px var(--paper-shadow);
}

/* SCHEDULE CARDS */
.card-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 18px;
}

.card {
    background: var(--card-bg);
    border: 2px solid var(--card-border);
    border-radius: 10px;
    padding: 18px 22px;
    display: flex;
    gap: 20px;
    align-items: flex-start;
    box-shadow: 0 5px 15px var(--paper-shadow);
    backdrop-filter: blur(4px);
    position: relative;
    transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
}

.card:hover {
    transform: translateY(-3px);
    border-color: var(--accent-gold);
    box-shadow: 0 8px 22px var(--paper-shadow);
}

.card.process {
    border-color: var(--accent-wax);
    animation: vintagePulse 1.4s infinite alternate;
}

@keyframes vintagePulse {
    0% { box-shadow: 0 0 8px rgba(139, 30, 30, 0.4); }
    100% { box-shadow: 0 0 25px rgba(139, 30, 30, 0.85); border-color: #d93838; }
}

.time-box {
    min-width: 145px;
    text-align: center;
    padding: 12px 16px;
    border-radius: 8px;
    background: rgba(0, 0, 0, 0.06);
    border: 1px double var(--card-border);
    box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.1);
}

.time {
    font-family: 'Cinzel', serif;
    font-size: 34px;
    font-weight: 900;
    color: var(--text-primary);
    line-height: 1;
}

.wib {
    font-family: 'Playfair Display', serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    letter-spacing: 2px;
    margin-top: 4px;
}

.status {
    margin-top: 8px;
    font-family: 'MedievalSharp', cursive;
    font-size: 15px;
    font-weight: 700;
    color: var(--accent-cyan-ink);
}

.status.blink {
    animation: vintageBlink 0.8s infinite alternate;
}

@keyframes vintageBlink {
    from { opacity: 1; }
    to { opacity: 0.3; }
}

/* LINKS */
.links {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
}

.item {
    display: flex;
    align-items: center;
    gap: 14px;
    background: rgba(0, 0, 0, 0.04);
    padding: 10px 14px;
    border-radius: 6px;
    border: 1px solid rgba(0, 0, 0, 0.05);
    transition: background 0.2s ease;
}

.item:hover {
    background: rgba(0, 0, 0, 0.08);
}

.item input[type="checkbox"] {
    appearance: none;
    width: 24px;
    height: 24px;
    border: 2px solid var(--accent-wax);
    border-radius: 50%;
    background: transparent;
    cursor: pointer;
    position: relative;
    flex-shrink: 0;
    transition: all 0.25s ease;
}

.item input[type="checkbox"]:checked {
    background: var(--accent-wax);
    box-shadow: 0 0 8px rgba(139, 30, 30, 0.6);
}

.item input[type="checkbox"]:checked::after {
    content: '✓';
    position: absolute;
    color: #fff8eb;
    font-size: 15px;
    font-weight: bold;
    top: -1px;
    left: 5px;
}

.item a {
    text-decoration: none;
    color: var(--text-primary);
    font-family: 'IM Fell English', serif;
    font-size: 19px;
    font-weight: 700;
    letter-spacing: 0.5px;
    transition: color 0.2s ease;
}

.item a:hover {
    color: var(--accent-wax);
    text-decoration: underline;
}

/* TOGGLE & ADD HISTORY BUTTONS */
.history-action-row {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
}

.toggle-history-btn, .add-history-btn {
    font-family: 'Cinzel', serif;
    font-size: 12px;
    font-weight: 700;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    gap: 5px;
}

.toggle-history-btn {
    background: rgba(0, 0, 0, 0.06);
    color: var(--text-primary);
    border: 1px solid var(--card-border);
}

.toggle-history-btn:hover {
    background: var(--accent-gold);
    color: #1a0f05;
}

.add-history-btn {
    background: var(--accent-wax);
    color: #fff8eb;
    border: 1px solid var(--card-border);
}

.add-history-btn:hover {
    background: #a32222;
}

/* HISTORY TABEL RESULT */
.history-table-wrapper {
    margin-top: 6px;
    background: rgba(255, 255, 255, 0.4);
    border: 1px solid var(--card-border);
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    display: none;
}

.history-table-wrapper.show {
    display: block;
}

.history-table {
    width: 100%;
    border-collapse: collapse;
    font-family: sans-serif;
}

.history-table th {
    font-family: 'Cinzel', serif;
    font-size: 14px;
    font-weight: 700;
    color: var(--text-primary);
    padding: 10px 12px;
    text-align: center;
    border-bottom: 2px solid var(--card-border);
    background: rgba(0, 0, 0, 0.03);
}

.history-table td {
    font-family: 'Roboto Mono', monospace;
    font-size: 15px;
    font-weight: 700;
    color: var(--text-primary);
    padding: 9px 12px;
    text-align: center;
    border-bottom: 1px solid rgba(0, 0, 0, 0.06);
}

.history-table tbody tr:nth-child(odd) {
    background: rgba(0, 0, 0, 0.04);
}

.history-table tbody tr:nth-child(even) {
    background: rgba(255, 255, 255, 0.2);
}

/* Delete button for custom cards */
.delete-card-btn {
    opacity: 0.4;
    transition: opacity 0.2s ease;
    cursor: pointer;
    padding: 4px 8px;
    color: var(--accent-wax);
    font-size: 14px;
}
.card:hover .delete-card-btn {
    opacity: 1;
}

/* FOOTER & MODAL */
.footer {
    margin-top: 50px;
    padding: 24px 0;
    text-align: center;
    font-family: 'Cinzel', serif;
    font-size: 22px;
    font-weight: 900;
    color: var(--text-secondary);
    letter-spacing: 4px;
    border-top: 2px double var(--paper-border);
}

.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(4px);
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
}

.modal-overlay.open {
    opacity: 1;
    pointer-events: auto;
}

.modal-content {
    background: var(--paper-bg);
    border: 3px double var(--paper-border);
    border-radius: 12px;
    padding: 24px;
    width: 90%;
    max-width: 480px;
    box-shadow: 0 10px 30px var(--paper-shadow);
    color: var(--text-primary);
}

@media(max-width: 768px) {
    body { padding: 12px; }
    .card { flex-direction: column; text-align: center; padding: 14px; align-items: stretch; }
    .time-box { width: 100%; min-width: auto; }
    .links { width: 100%; }
    .item { justify-content: flex-start; }
    .item a { font-size: 16px; }
    .theme-btn { font-size: 11px; padding: 6px 10px; }
    .history-table th, .history-table td { padding: 7px 6px; font-size: 13px; }
}
</style>
</head>
<body>

<!-- Animated Canvas Background -->
<canvas id="vintageCanvas"></canvas>

<div class="parchment-container">

    <!-- STICKY TOP GROUP -->
    <div class="sticky-top-group">
        <!-- HEADER SECTION -->
        <div class="header-box">
            <div class="header-title">JADWAL RESULT ALL PASARAN</div>
            <div class="header-subtitle">PERUBAHAN JAM RESULT (TANGGAL 1 NOVEMBER 2026)</div>
            <div class="header-date" id="headerDate">Kamis, 05 November 2026</div>
            <div class="live-clock" id="clock">00:00:00 WIB</div>
        </div>

        <!-- THEME SWITCHER PANEL -->
        <div class="theme-panel">
            <div class="text-xs font-bold uppercase tracking-wider text-center md:text-left mb-2 opacity-80" style="font-family: 'Cinzel', serif;">
                📜 Pilih Tema Naskah / Vintage Theme:
            </div>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-2">
                <button class="theme-btn active" onclick="setTheme('default', this)">
                    <span>📜 Kertas Kuno</span>
                </button>
                <button class="theme-btn" onclick="setTheme('dark-parchment', this)">
                    <span>📜 Naskah Gelap</span>
                </button>
                <button class="theme-btn" onclick="setTheme('pirate-map', this)">
                    <span>🗺️ Peta Harta</span>
                </button>
                <button class="theme-btn" onclick="setTheme('wax-scroll', this)">
                    <span>🕯️ Kertas Lilin</span>
                </button>
            </div>
        </div>

        <!-- CONTROLS: SEARCH & ADD MARKET -->
        <div class="controls-row">
            <div class="search-container">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" class="search-input" placeholder="Cari Pasaran...">
            </div>
            <button class="add-btn" onclick="toggleModal(true)">
                <span>➕ Tambah Pasaran</span>
            </button>
        </div>
    </div>

    <!-- CARD GRID CONTAINER -->
    <div class="card-grid" id="cardGrid">

        <!-- CARD 1 (TOTO MACAU) -->
        <div class="card" data-card-key="card-macau-0005">
            <div class="time-box">
                <div class="time">00:05</div>
                <div class="wib">WIB</div>
                <div class="status"></div>
            </div>
            <div class="links">
                <div class="item">
                    <input type="checkbox">
                    <a href="https://kick.com/live-ttm4d/videos" target="_blank">
                        TOTO MACAU 4D 00.00 (KICK)
                    </a>
                </div>
                <div class="item">
                    <input type="checkbox">
                    <a href="https://ttmpools.online/" target="_blank">
                        TOTO MACAU 4D 00.00
                    </a>
                </div>

                <!-- TOMBOL ACTION HISTORY -->
                <div class="history-action-row">
                    <button class="toggle-history-btn" onclick="toggleHistory(this)">
                        📜 Lihat History Result
                    </button>
                    <button class="add-history-btn" onclick="openAddHistoryModal('card-macau-0005')">
                        ➕ Tambah
                    </button>
                </div>

                <!-- TABEL HISTORY KELUARAN (MAKSIMAL 7 HARI) -->
                <div class="history-table-wrapper">
                    <table class="history-table">
                        <thead>
                            <tr>
                                <th>Tanggal</th>
                                <th>Prize 1</th>
                                <th>Prize 2</th>
                                <th>Prize 3</th>
                            </tr>
                        </thead>
                        <tbody id="tbody-card-macau-0005">
                            <!-- Tersinkronisasi otomatis via JavaScript & localStorage -->
                        </tbody>
                    </table>
                </div>

            </div>
        </div>

    </div>

    <!-- FOOTER -->
    <div class="footer">BY HONG RESULT</div>

</div>

<!-- ADD MARKET MODAL -->
<div class="modal-overlay" id="addModal">
    <div class="modal-content">
        <h3 class="font-bold text-xl mb-4 text-center" style="font-family: 'Cinzel', serif;">Tambah Pasaran Baru</h3>
        <div class="flex flex-col gap-3">
            <div>
                <label class="text-sm font-bold block mb-1">Jam Result (HH:MM)</label>
                <input type="text" id="newTime" placeholder="Contoh: 14:00" class="search-input !py-2 !px-3">
            </div>
            <div>
                <label class="text-sm font-bold block mb-1">Nama Pasaran / Link Text</label>
                <input type="text" id="newName" placeholder="Contoh: BULLSEYE 12:15" class="search-input !py-2 !px-3">
            </div>
            <div>
                <label class="text-sm font-bold block mb-1">URL Target (Opsional)</label>
                <input type="text" id="newUrl" placeholder="https://..." class="search-input !py-2 !px-3">
            </div>
        </div>
        <div class="flex justify-end gap-2 mt-6">
            <button class="theme-btn" onclick="toggleModal(false)">Batal</button>
            <button class="add-btn !py-2 !px-4" onclick="addNewMarket()">Simpan</button>
        </div>
    </div>
</div>

<!-- ADD HISTORY ROW MODAL -->
<div class="modal-overlay" id="addHistoryModal">
    <div class="modal-content">
        <h3 class="font-bold text-xl mb-4 text-center" style="font-family: 'Cinzel', serif;">Tambah Data History</h3>
        <input type="hidden" id="targetCardKey">
        <div class="flex flex-col gap-3">
            <div>
                <label class="text-sm font-bold block mb-1">Tanggal (DD-MM-YYYY)</label>
                <input type="text" id="inputHistDate" placeholder="Contoh: 05-11-2026" class="search-input !py-2 !px-3">
            </div>
            <div>
                <label class="text-sm font-bold block mb-1">Prize 1</label>
                <input type="text" id="inputPrize1" placeholder="Contoh: 0328" class="search-input !py-2 !px-3">
            </div>
            <div>
                <label class="text-sm font-bold block mb-1">Prize 2</label>
                <input type="text" id="inputPrize2" placeholder="Contoh: 5419" class="search-input !py-2 !px-3">
            </div>
            <div>
                <label class="text-sm font-bold block mb-1">Prize 3</label>
                <input type="text" id="inputPrize3" placeholder="Contoh: 3683" class="search-input !py-2 !px-3">
            </div>
        </div>
        <div class="flex justify-end gap-2 mt-6">
            <button class="theme-btn" onclick="toggleAddHistoryModal(false)">Batal</button>
            <button class="add-btn !py-2 !px-4" onclick="saveNewHistoryRow()">Simpan</button>
        </div>
    </div>
</div>

<script>
/* CANVAS ANIMATION */
const canvas = document.getElementById('vintageCanvas');
const ctx = canvas.getContext('2d');

let width = canvas.width = window.innerWidth;
let height = canvas.height = window.innerHeight;

class DustParticle {
    constructor() { this.reset(); }
    reset() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.size = Math.random() * 2.5 + 0.8;
        this.speedX = (Math.random() - 0.5) * 0.4;
        this.speedY = -(Math.random() * 0.4 + 0.1);
        this.opacity = Math.random() * 0.5 + 0.2;
    }
    update() {
        this.x += this.speedX;
        this.y += this.speedY;
        if (this.y < -10 || this.x < -10 || this.x > width + 10) {
            this.reset();
            this.y = height + 10;
        }
    }
    draw() {
        ctx.fillStyle = `rgba(120, 80, 30, ${this.opacity})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
    }
}

let particles = [];
function initParticles() {
    particles = [];
    const count = Math.floor((width * height) / 18000) + 25;
    for (let i = 0; i < count; i++) { particles.push(new DustParticle()); }
}

function animateParticles() {
    ctx.clearRect(0, 0, width, height);
    for (let p of particles) { p.update(); p.draw(); }
    requestAnimationFrame(animateParticles);
}

window.addEventListener('resize', () => {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    initParticles();
});

initParticles();
animateParticles();

/* TOGGLE HISTORY FUNCTION */
function toggleHistory(btn) {
    const wrapper = btn.closest('.links').querySelector('.history-table-wrapper');
    if (wrapper) {
        wrapper.classList.toggle('show');
        if (wrapper.classList.contains('show')) {
            btn.innerHTML = '📜 Sembunyikan History';
        } else {
            btn.innerHTML = '📜 Lihat History Result';
        }
    }
}

/* DEFAULT & LOCALSTORAGE HISTORY MANAGEMENT (MAX 7 DAYS) */
const defaultHistoryData = {
    'card-macau-0005': [
        { date: '04-11-2026', p1: '0328', p2: '5419', p3: '3683' },
        { date: '03-11-2026', p1: '6828', p2: '5100', p3: '6437' },
        { date: '02-11-2026', p1: '2617', p2: '8236', p3: '6493' }
    ]
};

function getCardHistory(cardKey) {
    const saved = localStorage.getItem('hist_data_' + cardKey);
    let data = [];
    if (saved) {
        try { data = JSON.parse(saved); } catch(e) {}
    } else {
        data = defaultHistoryData[cardKey] || [];
    }
    if (data.length > 7) {
        data = data.slice(0, 7);
    }
    return data;
}

function saveCardHistory(cardKey, data) {
    if (data.length > 7) {
        data = data.slice(0, 7);
    }
    localStorage.setItem('hist_data_' + cardKey, JSON.stringify(data));
}

function renderHistoryTable(cardKey) {
    const tbody = document.getElementById('tbody-' + cardKey);
    if (!tbody) return;

    const data = getCardHistory(cardKey);
    let html = '';
    if (data.length === 0) {
        html = `<tr><td colspan="4" style="font-style:italic; font-size:13px;">Belum ada data history.</td></tr>`;
    } else {
        data.forEach(row => {
            html += `
                <tr>
                    <td>${row.date}</td>
                    <td>${row.p1}</td>
                    <td>${row.p2}</td>
                    <td>${row.p3}</td>
                </tr>
            `;
        });
    }
    tbody.innerHTML = html;
}

function initAllHistories() {
    document.querySelectorAll('.card').forEach(card => {
        const key = card.getAttribute('data-card-key');
        if (key) {
            renderHistoryTable(key);
        }
    });
}

/* ADD HISTORY MODAL LOGIC */
function openAddHistoryModal(cardKey) {
    document.getElementById('targetCardKey').value = cardKey;
    document.getElementById('inputHistDate').value = '';
    document.getElementById('inputPrize1').value = '';
    document.getElementById('inputPrize2').value = '';
    document.getElementById('inputPrize3').value = '';
    document.getElementById('addHistoryModal').classList.add('open');
}

function toggleAddHistoryModal(open) {
    const modal = document.getElementById('addHistoryModal');
    if (open) modal.classList.add('open');
    else modal.classList.remove('open');
}

function saveNewHistoryRow() {
    const cardKey = document.getElementById('targetCardKey').value;
    const date = document.getElementById('inputHistDate').value.trim();
    const p1 = document.getElementById('inputPrize1').value.trim();
    const p2 = document.getElementById('inputPrize2').value.trim();
    const p3 = document.getElementById('inputPrize3').value.trim();

    if (!date || !p1) {
        alert('Mohon isi minimal Tanggal dan Prize 1.');
        return;
    }

    const data = getCardHistory(cardKey);
    data.unshift({ date, p1, p2: p2 || '-', p3: p3 || '-' });
    
    saveCardHistory(cardKey, data);
    renderHistoryTable(cardKey);

    // Otomatis buka tabel jika sedang tertutup agar langsung tersinkron dan terlihat
    const cardEl = document.querySelector(`[data-card-key="${cardKey}"]`);
    if (cardEl) {
        const wrapper = cardEl.querySelector('.history-table-wrapper');
        const btn = cardEl.querySelector('.toggle-history-btn');
        if (wrapper && !wrapper.classList.contains('show')) {
            wrapper.classList.add('show');
            if(btn) btn.innerHTML = '📜 Sembunyikan History';
        }
    }

    toggleAddHistoryModal(false);
}

/* THEME MANAGEMENT */
function setTheme(themeName, btn) {
    if (themeName === 'default') {
        document.documentElement.removeAttribute('data-theme');
    } else {
        document.documentElement.setAttribute('data-theme', themeName);
    }
    document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    localStorage.setItem('vintage_theme', themeName);
}

const savedTheme = localStorage.getItem('vintage_theme');
if (savedTheme) {
    const btn = document.querySelector(`.theme-btn[onclick*="${savedTheme}"]`);
    setTheme(savedTheme, btn);
}

/* REAL-TIME CLOCK & DATE */
function updateClock() {
    const now = new Date(new Date().toLocaleString("en-US", {timeZone: "Asia/Jakarta"}));
    const h = String(now.getHours()).padStart(2, "0");
    const m = String(now.getMinutes()).padStart(2, "0");
    const s = String(now.getSeconds()).padStart(2, "0");

    document.getElementById("clock").innerHTML = `${h}:${m}:${s} WIB`;

    const hari = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
    const bulan = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];

    document.getElementById("headerDate").innerHTML = `${hari[now.getDay()]}, ${String(now.getDate()).padStart(2, "0")} ${bulan[now.getMonth()]} ${now.getFullYear()}`;
}
setInterval(updateClock, 1000);
updateClock();

/* SEARCH FILTER */
document.getElementById('searchInput').addEventListener('keyup', function() {
    const val = this.value.toLowerCase();
    document.querySelectorAll('.card').forEach(card => {
        card.style.display = card.innerText.toLowerCase().includes(val) ? 'flex' : 'none';
    });
});

/* CHECKBOX PERSISTENCE */
function bindCheckboxes() {
    const checkboxes = document.querySelectorAll('.item input[type="checkbox"]');
    checkboxes.forEach((box, i) => {
        box.checked = localStorage.getItem('vintage_check_' + i) === 'true';
        box.onclick = () => localStorage.setItem('vintage_check_' + i, box.checked);
    });
}
bindCheckboxes();

/* DYNAMIC MARKET CREATION & DELETION */
function toggleModal(open) {
    const modal = document.getElementById('addModal');
    if (open) modal.classList.add('open');
    else modal.classList.remove('open');
}

function addNewMarket() {
    const timeVal = document.getElementById('newTime').value.trim();
    const nameVal = document.getElementById('newName').value.trim();
    const urlVal = document.getElementById('newUrl').value.trim() || '#';

    if (!timeVal || !nameVal) {
        alert('Mohon isi jam result dan nama pasaran.');
        return;
    }

    const cardKey = 'custom-' + Date.now();
    const cardGrid = document.getElementById('cardGrid');

    const cardDiv = document.createElement('div');
    cardDiv.className = 'card';
    cardDiv.setAttribute('data-id', cardKey);
    cardDiv.setAttribute('data-card-key', cardKey);
    cardDiv.innerHTML = `
        <div class="time-box">
            <div class="time">${timeVal}</div>
            <div class="wib">WIB</div>
            <div class="status"></div>
        </div>
        <div class="links">
            <div class="item">
                <input type="checkbox">
                <a href="${urlVal}" target="_blank">${nameVal.toUpperCase()}</a>
                <span class="delete-card-btn ml-auto" onclick="removeCard('${cardKey}')" title="Hapus Pasaran">🗑️</span>
            </div>
            <div class="history-action-row">
                <button class="toggle-history-btn" onclick="toggleHistory(this)">
                    📜 Lihat History Result
                </button>
                <button class="add-history-btn" onclick="openAddHistoryModal('${cardKey}')">
                    ➕ Tambah
                </button>
            </div>
            <div class="history-table-wrapper">
                <table class="history-table">
                    <thead>
                        <tr>
                            <th>Tanggal</th>
                            <th>Prize 1</th>
                            <th>Prize 2</th>
                            <th>Prize 3</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-${cardKey}">
                    </tbody>
                </table>
            </div>
        </div>
    `;

    cardGrid.appendChild(cardDiv);
    saveCustomCards();
    bindCheckboxes();
    renderHistoryTable(cardKey);
    updateStatus();

    // Reset Form
    document.getElementById('newTime').value = '';
    document.getElementById('newName').value = '';
    document.getElementById('newUrl').value = '';
    toggleModal(false);
}

function removeCard(cardKey) {
    const card = document.querySelector(`.card[data-card-key="${cardKey}"]`);
    if (card) {
        card.remove();
        localStorage.removeItem('hist_data_' + cardKey);
        saveCustomCards();
    }
}

function saveCustomCards() {
    const customCards = [];
    document.querySelectorAll('.card[data-id^="custom-"]').forEach(card => {
        const time = card.querySelector('.time').innerText;
        const link = card.querySelector('.item a');
        const cardKey = card.getAttribute('data-card-key');
        customCards.push({
            id: cardKey,
            time: time,
            name: link.innerText,
            url: link.getAttribute('href')
        });
    });
    localStorage.setItem('vintage_custom_cards', JSON.stringify(customCards));
}

function loadCustomCards() {
    const saved = localStorage.getItem('vintage_custom_cards');
    if (!saved) return;
    const cards = JSON.parse(saved);
    const cardGrid = document.getElementById('cardGrid');

    cards.forEach(c => {
        const cardKey = c.id;

        const cardDiv = document.createElement('div');
        cardDiv.className = 'card';
        cardDiv.setAttribute('data-id', cardKey);
        cardDiv.setAttribute('data-card-key', cardKey);
        cardDiv.innerHTML = `
            <div class="time-box">
                <div class="time">${c.time}</div>
                <div class="wib">WIB</div>
                <div class="status"></div>
            </div>
            <div class="links">
                <div class="item">
                    <input type="checkbox">
                    <a href="${c.url}" target="_blank">${c.name}</a>
                    <span class="delete-card-btn ml-auto" onclick="removeCard('${cardKey}')" title="Hapus Pasaran">🗑️</span>
                </div>
                <div class="history-action-row">
                    <button class="toggle-history-btn" onclick="toggleHistory(this)">
                        📜 Lihat History Result
                    </button>
                    <button class="add-history-btn" onclick="openAddHistoryModal('${cardKey}')">
                        ➕ Tambah
                    </button>
                </div>
                <div class="history-table-wrapper">
                    <table class="history-table">
                        <thead>
                            <tr>
                                <th>Tanggal</th>
                                <th>Prize 1</th>
                                <th>Prize 2</th>
                                <th>Prize 3</th>
                            </tr>
                        </thead>
                        <tbody id="tbody-${cardKey}">
                        </tbody>
                    </table>
                </div>
            </div>
        `;
        cardGrid.appendChild(cardDiv);
        renderHistoryTable(cardKey);
    });
    bindCheckboxes();
}
loadCustomCards();
initAllHistories();

/* SCHEDULE COUNTDOWN & HOLIDAY STATUS */
function updateStatus() {
    const now = new Date(new Date().toLocaleString('en-US', {timeZone: 'Asia/Jakarta'}));
    const day = now.getDay();
    const currentSeconds = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();

    document.querySelectorAll('.card').forEach(card => {
        const timeText = card.querySelector('.time').innerText.trim();
        if (!timeText.includes(':')) return;

        const status = card.querySelector('.status');
        const [h, m] = timeText.split(':').map(Number);
        const targetSeconds = h * 3600 + m * 60;

        let diff = targetSeconds - currentSeconds;
        if (diff < 0) diff += 86400;

        const hours = Math.floor(diff / 3600);
        const minutes = Math.floor((diff % 3600) / 60);
        const seconds = diff % 60;
        const marketText = card.querySelector('.links').innerText.toUpperCase();

        // Holiday Check Rules
        if (
            (day === 0 && (marketText.includes("PCSO") || marketText.includes("TENNESSE MORNING") || marketText.includes("TEXAS MORNING"))) ||
            (day === 1 && (marketText.includes("TENNESSE MID") || marketText.includes("TEXAS DAY") || marketText.includes("ARKANSAS MID") || marketText.includes("TEXAS EVE") || marketText.includes("TEXAS NIGHT"))) ||
            ([1, 2, 4, 5].includes(day) && marketText.includes("MAGNUM4D")) ||
            ([2, 5].includes(day) && marketText.includes("SINGAPORE"))
        ) {
            status.innerHTML = "🔴 LIBUR";
            status.style.color = "var(--accent-wax)";
            status.classList.add("blink");
            card.classList.remove("process");
            return;
        }

        status.classList.remove('blink');
        card.classList.remove('process');

        if (diff <= 300) {
            status.innerHTML = '🆘 ON PROCESS';
            status.style.color = 'var(--accent-wax)';
            status.classList.add('blink');
            card.classList.add('process');
        } else if (diff <= 1800) {
            status.innerHTML = `⚠️ ${hours}h ${minutes}m ${seconds}s`;
            status.style.color = 'var(--accent-gold)';
        } else {
            status.innerHTML = `⏳ ${hours}h ${minutes}m ${seconds}s`;
            status.style.color = 'var(--accent-cyan-ink)';
        }
    });
}
setInterval(updateStatus, 1000);
updateStatus();
</script>
</body>
</html>
